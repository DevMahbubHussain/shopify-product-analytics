# Shopify App Configuration
# Pinned API version: 2026-10 (latest stable, accessible until 2027-10-16)

# Template config. Keep client_id as a placeholder here; put the real one in the gitignored
# shopify.app.local.toml (see STARTER.md). The client secret lives only in root .env.
client_id = "REPLACE_WITH_DEV_DASHBOARD_CLIENT_ID"
name = "Product Analytics"
handle = "product-analytics"
application_url = "http://localhost:3000"
embedded = true

[access_scopes]
scopes = "read_products,read_orders"

[auth]
redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/shopify/callback"
]

[webhooks]
api_version = "2026-10"

[pos]
embedded = false
