services:
  postgres:
    image: postgres:16-alpine
    container_name: spa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shopify_analytics}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: spa_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  laravel-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: spa_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  shopify-app:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    container_name: spa_shopify_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./shopify-app:/app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_API_URL: http://backend:8000
      S2S_SHARED_SECRET: ${S2S_SHARED_SECRET:?Set S2S_SHARED_SECRET in .env}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
