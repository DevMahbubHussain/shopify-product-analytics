services:
  postgres:
    image: postgres:16-alpine
    container_name: spa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopify_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: spa_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Shopify Product Analytics"
      APP_ENV: local
      APP_KEY: base64:aZW+dmYlaT8Mzge+r3DfWVrg/JQEmjkg3OPT76uYN3I=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: shopify_analytics
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      S2S_SHARED_SECRET: 7f8c9b2a1e4d5f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  laravel-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: spa_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment:
      APP_NAME: "Shopify Product Analytics"
      APP_ENV: local
      APP_KEY: base64:aZW+dmYlaT8Mzge+r3DfWVrg/JQEmjkg3OPT76uYN3I=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: shopify_analytics
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      S2S_SHARED_SECRET: 7f8c9b2a1e4d5f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  shopify-app:
    build:
      context: .
      dockerfile: infrastructure/docker/node/Dockerfile
    container_name: spa_shopify_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./shopify-app:/app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_API_URL: http://backend:8000
      S2S_SHARED_SECRET: 7f8c9b2a1e4d5f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f4
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
